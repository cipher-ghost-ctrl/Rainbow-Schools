<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainbow Punjabi Accelerated Reading — Stage 1 Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430;
    --paper:#FBF3E7; --paper-2:#F3E7D6;
    --green:#3E7D44; --green-l:#EAF3E7;
    --marigold:#E8933F; --terracotta:#C1502E; --sage:#6E8B5D;
    --line:rgba(27,36,48,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--ink);color:var(--ink);
    font-family:'Work Sans',sans-serif;line-height:1.55;
    height:100vh;overflow:hidden;
  }
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;margin:0 0 .4em;}
  p{margin:0 0 .9em;}
  a{color:inherit;}

  .topbar{
    position:fixed;top:0;left:0;right:0;height:56px;z-index:100;
    background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;border-bottom:1px solid rgba(255,255,255,0.08);
    gap:10px;
  }
  .topbar .logo{font-family:'Fraunces',serif;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--marigold);flex-shrink:0;}
  .logo .full{display:inline;}
  .logo .short{display:none;}
  .topbar a.back{font-size:12px;color:rgba(255,255,255,0.55);text-decoration:none;flex-shrink:0;white-space:nowrap;}
  .topbar a.back:hover{color:#fff;}
  .stars-badge{font-family:'Space Mono',monospace;font-size:12px;color:var(--marigold);background:rgba(232,147,63,0.15);padding:5px 12px;border-radius:14px;flex-shrink:0;white-space:nowrap;}
  .topbar-right{display:flex;align-items:center;gap:14px;flex-shrink:0;}

  .stage{
    position:fixed;top:56px;bottom:76px;left:0;right:0;
    display:flex;align-items:center;justify-content:center;
    perspective:2400px;padding:20px;
  }
  .book{
    position:relative;width:min(880px, 94vw);height:min(560px, 78vh);
  }
  .page{
    position:absolute;inset:0;
    background:var(--paper);border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
    overflow:hidden;
    transform-origin:left center;
    transition:transform .55s cubic-bezier(.4,.1,.2,1);
    backface-visibility:hidden;
  }
  .page-inner{ height:100%; width:100%; overflow-y:auto; padding:44px 52px 40px; }
  .page-inner::-webkit-scrollbar{width:6px;}
  .page-inner::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:3px;}

  .page-band{
    background:var(--green);color:#fff;padding:14px 52px;
    font-family:'Fraunces',serif;font-weight:600;font-size:15px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .page-band .sub{font-family:'Work Sans';font-weight:500;font-size:12px;opacity:0.85;}
  .page-num{position:absolute;bottom:14px;right:20px;font-family:'Space Mono',monospace;font-size:11px;color:rgba(27,36,48,0.35);}

  .controls{
    position:fixed;bottom:0;left:0;right:0;height:76px;background:var(--ink);
    display:flex;align-items:center;justify-content:center;gap:18px;
    border-top:1px solid rgba(255,255,255,0.08);
  }
  .nav-btn{
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;
    width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;
  }
  .nav-btn:hover{background:rgba(255,255,255,0.14);}
  .nav-btn:disabled{opacity:0.25;cursor:not-allowed;}
  .page-indicator{color:rgba(255,255,255,0.6);font-family:'Space Mono',monospace;font-size:12px;min-width:70px;text-align:center;}
  .jump-select{
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;
    border-radius:20px;padding:8px 14px;font-size:12px;font-family:'Work Sans';max-width:220px;
  }

  .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--terracotta);display:block;margin-bottom:10px;}
  .cover-page{background:linear-gradient(180deg,var(--green) 0%, var(--green) 32%, var(--paper) 32%);display:flex;flex-direction:column;height:100%;}
  .cover-top{padding:28px 40px;color:#fff;}
  .cover-top .tag{font-family:'Space Mono',monospace;font-size:11px;background:rgba(255,255,255,0.15);display:inline-block;padding:4px 10px;border-radius:10px;margin-bottom:10px;}
  .cover-top h1{font-size:26px;color:#fff;margin:0;}
  .cover-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 40px;text-align:center;}
  .cover-mid .letters{font-family:'Fraunces',serif;font-size:52px;color:var(--terracotta);letter-spacing:4px;}
  .cover-mid .letters-en{font-family:'Space Mono',monospace;font-size:13px;color:var(--ink);margin-top:4px;}
  .cover-mid h2{font-size:22px;margin-top:20px;}
  .cover-mid .author{font-family:'Work Sans';font-size:13px;color:rgba(27,36,48,0.6);margin-top:16px;}

  .kit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:20px;}
  .kit-item{background:var(--paper-2);border-radius:12px;padding:16px;text-align:center;font-size:12px;color:var(--ink);}
  .kit-item .emoji{font-size:26px;display:block;margin-bottom:8px;}

  .stage-chip-row{display:flex;gap:6px;margin-top:24px;}
  .stage-chip{flex:1;text-align:center;padding:8px 4px;border-radius:6px;font-family:'Space Mono',monospace;font-size:10px;color:#fff;}

  .rule-item{display:flex;gap:12px;margin-bottom:16px;align-items:flex-start;}
  .rule-item .ic{font-size:18px;}
  .rule-item b{display:block;margin-bottom:2px;}

  .howto-steps{counter-reset:step;padding-left:0;list-style:none;}
  .howto-steps li{counter-increment:step;margin-bottom:10px;padding-left:30px;position:relative;}
  .howto-steps li::before{content:counter(step);position:absolute;left:0;top:0;width:20px;height:20px;background:var(--sage);color:#fff;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;}

  .book-overview-card{background:var(--paper-2);border-radius:12px;padding:18px;margin-bottom:12px;}
  .book-overview-card h3{font-size:15px;margin-bottom:4px;}
  .book-overview-card p{font-size:13px;color:rgba(27,36,48,0.65);margin:0;}

  .session-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .session-header h2{font-size:17px;margin:0;}
  .session-time{font-family:'Space Mono',monospace;font-size:11px;color:var(--terracotta);background:rgba(193,80,46,0.1);padding:4px 10px;border-radius:10px;}
  .session-need{font-size:12px;color:rgba(27,36,48,0.6);margin-bottom:16px;}

  .letter-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .letter-tile{background:#fff;border:1px solid var(--line);border-radius:12px;width:64px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:transform .15s;}
  .letter-tile:hover{transform:translateY(-3px);border-color:var(--sage);}
  .letter-tile.done{background:var(--green-l);border-color:var(--sage);}
  .letter-tile .gur{font-family:'Fraunces',serif;font-size:26px;color:var(--terracotta);}
  .letter-tile .eng{font-family:'Space Mono',monospace;font-size:10px;color:rgba(27,36,48,0.55);}

  .flip-btn{background:var(--sage);color:#fff;border:none;padding:9px 18px;border-radius:18px;font-size:12px;font-weight:600;cursor:pointer;}
  .snap-cards{display:flex;gap:10px;margin:14px 0;min-height:74px;flex-wrap:wrap;}
  .snap-card{width:62px;height:74px;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:26px;color:var(--terracotta);animation:flipin .3s ease;}
  @keyframes flipin{from{transform:rotateY(90deg);opacity:0;}to{transform:rotateY(0);opacity:1;}}
  .snap-btn{background:var(--terracotta);color:#fff;border:none;padding:9px 18px;border-radius:18px;font-size:12px;font-weight:600;cursor:pointer;}
  .snap-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .feedback{margin-top:10px;font-size:12px;color:var(--terracotta);min-height:16px;}

  .memory-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:400px;margin-bottom:10px;}
  .memory-card{aspect-ratio:1;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:22px;color:transparent;cursor:pointer;user-select:none;}
  .memory-card.flipped{color:var(--terracotta);background:var(--green-l);}
  .memory-card.matched{background:var(--sage);color:#fff;cursor:default;}

  .word-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px;}
  .word-table th,.word-table td{border:1px solid var(--line);padding:8px;text-align:center;}
  .word-table th{background:var(--paper-2);font-family:'Space Mono',monospace;font-size:12px;}
  .word-table td.real{color:var(--sage);font-family:'Fraunces',serif;font-weight:600;cursor:pointer;}
  .word-table td.silly{color:rgba(27,36,48,0.35);font-family:'Fraunces',serif;}
  .word-table td:hover{background:var(--paper-2);}

  .matra-box{display:flex;gap:20px;align-items:center;background:var(--paper-2);border-radius:12px;padding:16px;margin-bottom:16px;flex-wrap:wrap;}
  .matra-box .m{font-family:'Fraunces',serif;font-size:30px;color:var(--terracotta);}
  .matra-box .desc{font-size:12px;color:rgba(27,36,48,0.65);max-width:280px;}

  .word-cards{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
  .wc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-family:'Fraunces',serif;font-size:18px;color:var(--terracotta);cursor:pointer;text-align:center;position:relative;}
  .wc .rom{display:block;font-family:'Space Mono',monospace;font-size:9px;color:rgba(27,36,48,0.4);margin-top:2px;}
  .wc.revealed{background:var(--green-l);border-color:var(--sage);}

  .glossary-search{width:100%;padding:10px 14px;border-radius:20px;border:1px solid var(--line);font-size:13px;margin-bottom:16px;font-family:'Work Sans';}
  .gloss-row{display:flex;gap:14px;border-bottom:1px solid var(--line);padding:8px 0;font-size:13px;}
  .gloss-row .g{font-family:'Fraunces',serif;color:var(--terracotta);min-width:56px;}
  .gloss-row .r{font-family:'Space Mono',monospace;font-size:11px;color:rgba(27,36,48,0.5);min-width:80px;}

  .author-card{display:flex;gap:20px;align-items:flex-start;margin-top:10px;}
  .author-photo{width:80px;height:80px;border-radius:50%;background:var(--paper-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px;}

  .teaser-box{background:rgba(232,147,63,0.08);border:1px dashed rgba(232,147,63,0.5);border-radius:12px;padding:18px;margin-top:14px;}
  .char-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .char-chip{font-family:'Space Mono',monospace;font-size:11px;background:#fff;border:1px solid var(--line);padding:5px 12px;border-radius:14px;}

  @media (max-width:640px){
    .topbar{height:52px;padding:0 12px;gap:6px;}
    .topbar .logo{font-size:13px;max-width:34vw;}
    .logo .full{display:none;}
    .logo .short{display:inline;}
    .back .full{display:none;}
    .back .short{display:inline;}
    .topbar-right{gap:8px;}
    .back{font-size:11px;}
    .stars-badge{font-size:10px;padding:4px 8px;}
    .star-label{display:none;}
    .stage{top:52px;bottom:64px;padding:10px;}
    .controls{height:64px;gap:10px;}
    .nav-btn{width:38px;height:38px;font-size:15px;}
    .page-indicator{font-size:11px;min-width:56px;}
    .jump-select{max-width:120px;font-size:11px;padding:7px 10px;}
    .page-band{padding:11px 20px;font-size:13px;flex-wrap:wrap;gap:2px;}
    .page-band .sub{font-size:10px;}
    .page-inner{padding:22px 18px 26px;}
    .page-num{font-size:10px;bottom:8px;right:12px;}
    .cover-mid .letters{font-size:32px;}
    .cover-top h1{font-size:19px;}
    .kit-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
    .memory-grid{grid-template-columns:repeat(4,1fr);gap:6px;}
    .letter-tile{width:56px;height:66px;}
    .word-table{display:block;overflow-x:auto;white-space:nowrap;}
    .word-table th,.word-table td{padding:6px;font-size:12px;}
    .snap-card{width:52px;height:62px;font-size:22px;}
    .stage{perspective:none;}
    .page{
      box-shadow:0 8px 20px rgba(0,0,0,0.35);
      transition:transform .32s ease, opacity .32s ease;
    }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><span class="dot"></span><span class="full">Rainbow Punjabi Accelerated Reading</span><span class="short">Rainbow Punjabi</span></div>
  <div class="topbar-right">
    <div class="stars-badge">★ <span id="starTotal">0</span><span class="star-label"> gold stars</span></div>
    <a class="back" href="index.html"><span class="full">← Rainbow Schools site</span><span class="short">← Rainbow Schools</span></a>
  </div>
</div>

<div class="stage">
  <div class="book" id="book"></div>
</div>

<div class="controls">
  <button class="nav-btn" id="prevBtn">‹</button>
  <div class="page-indicator" id="pageIndicator">Page 1 / 1</div>
  <button class="nav-btn" id="nextBtn">›</button>
  <select class="jump-select" id="jumpSelect"></select>
</div>

<script>
const B1 = [{gur:'ਹ',eng:'h'},{gur:'ਰ',eng:'r'},{gur:'ਗ',eng:'g'},{gur:'ਮ',eng:'m'},{gur:'ਸ',eng:'s'}];
const B1_3 = B1.slice(0,3);

let stars = 0;
function addStars(n){ stars += n; document.getElementById('starTotal').textContent = stars; }

const PAGES = [
  { key:'cover', title:'Cover' },
  { key:'kit', title:'What\'s in the pack' },
  { key:'series', title:'Series title' },
  { key:'tagline', title:'5 letters at a time' },
  { key:'stage1intro', title:'Stage 1 — Green' },
  { key:'letter', title:'Why choose this scheme', heading:'Why choose the \u2018Rainbow Punjabi Accelerated Reading Scheme\u2019?',
    body:[
      'Dear Parent, Teacher, Self Learner,',
      'Punjabi is a beautifully phonetic language — once you learn the 35 letters of the paintee (the Punjabi alphabet) and the 12 accent marks (matras), reading becomes simply a case of sounding out what you see.',
      'But here\u2019s the biggest issue: traditionally, learners are expected to memorise all 35 letters before they can even begin reading. Many children lose motivation and interest along the way — it becomes a chore rather than a joy.',
      'That\u2019s what inspired this Rainbow Accelerated Reading Scheme: a carefully thought through, structured, play-based system that breaks learning into 7 simple Stages, starting with just five letters at a time.'
    ]
  },
  { key:'letter', title:'Before you begin', heading:'Do STRICTLY follow the guide, in order',
    body:[
      'Whether you\u2019re an adult learner, a teacher, or a parent helping your child, follow the graded sessions in the correct order — whilst having fun learning to read Punjabi.',
      'Just 10–15 minutes of focussed play daily is all you need. Watch your sight-word list grow as you start recognising words instantly.',
      'Start writing with the practice sheets and dry-wipe markers included — perfect for practice without pressure.',
      'Most of all, have fun! Speak Punjabi as often as you can — the more you do, the faster reading will follow.'
    ]
  },
  { key:'rules', title:'A few simple rules' },
  { key:'howto', title:'How to play SNAP', game:'snap-howto' },
  { key:'howto', title:'How to play MEMORY', game:'memory-howto' },
  { key:'overview', title:'Guidance & detailed sessions' },
  { key:'prep', title:'Get ready for Book 1' },
  { key:'session', title:'Book 1 · Session 1', book:1, n:1, heading:'Letter Introduction through Movement', time:'10\u201315 min',
    need:'Large cards with the letters h, r, g — cut out and stuck around the room.',
    letters:B1_3, activity:'intro' },
  { key:'session', title:'Book 1 · Session 2', book:1, n:2, heading:'Sound Matching & Memory', time:'10\u201315 min',
    need:'Two copies of each letter card (h, r, g).', letters:B1_3, activity:'memory' },
  { key:'session', title:'Book 1 · Session 3', book:1, n:3, heading:'Snap Game for Reinforcement', time:'10\u201315 min',
    need:'Large A5 cards + 4 small cards of each letter (h, r, g).', letters:B1_3, activity:'snap' },
  { key:'session', title:'Book 1 · Session 4', book:1, n:4, heading:'Add New Letters: \u2018m\u2019 and \u2018s\u2019', time:'10\u201315 min',
    need:'Large A5 cards with h, r, g, m, s.', letters:B1, activity:'snap' },
  { key:'session', title:'Book 1 · Session 5', book:1, n:5, heading:'Word Building Fun', time:'10\u201315 min',
    need:'4 small cards of h, r, g, m, s.', letters:B1, activity:'wordbuild' },
  { key:'session', title:'Book 1 · Session 6', book:1, n:6, heading:'Reading Words with SNAP', time:'10\u201315 min',
    need:'Two copies of each Book 1 mukta word card.', letters:B1, activity:'snap-words' },
  { key:'session', title:'Book 1 · Session 7', book:1, n:7, heading:'Copy the Words!', time:'10\u201315 min',
    need:'Book 1 mukta word cards, with and without pictures.', letters:B1, activity:'wordbuild' },
  { key:'session', title:'Book 1 · Session 8', book:1, n:8, heading:'Reading and Writing!', time:'10\u201315 min',
    need:'Book 1 mukta word cards.', letters:B1, activity:'snap-words', badge:'WELL DONE! Ready for Book 2?' },
  { key:'book2title', title:'Book 2 — Introducing the matras' },
  { key:'letter', title:'What are matras?', heading:'Matras are the accent marks that add a vowel to the letter sound',
    body:[
      'From Book 1, you\u2019re now familiar with the 5 letter sounds of h, r, g, m and s, and able to recognise them instantly. You\u2019ve begun joining letters to make simple \u201cmukta\u201d words — meaning with no matras.',
      'The matras are accent marks that give vowel sounds to the letter they\u2019re applied to — sometimes called \u201clagaan matra\u201d. There are 12 matras in total.',
      'In Book 2 we introduce two of them: KANNA and KANNA BINDI.'
    ]
  },
  { key:'letter', title:'Preparing for Book 2', heading:'Once you have prepared the cards for Book 2, you are ready!',
    body:[
      'Cut out the Green cards from the A4 sleeve marked Book 2. Put the small letters with the kanna and kanna bindi cards in small pouches.',
      'In the table of possible words included, the GREEN words are REAL words with meaning — use the glossary to find out what they mean.',
      'In Book 3, we begin using picture cues in simple short stories to help with reading and understanding. Each stage builds carefully on the last.'
    ]
  },
  { key:'matras', title:'The matras: kanna & kanna bindi' },
  { key:'session', title:'Book 2 · Session 1', book:2, n:1, heading:'Introduce the \u201caa\u201d matra (kanna)', time:'10\u201315 min',
    need:'\u201caa\u201d (kanna) cards + Book 1 letter cards.', letters:B1, activity:'matra-intro', matra:{sym:'\u093E',sound:'aa'} },
  { key:'session', title:'Book 2 · Session 2', book:2, n:2, heading:'Words with letters and the kanna', time:'10\u201315 min',
    need:'All 2 copies of each letter card with kanna.', activity:'wordtable', table:'session2' },
  { key:'session', title:'Book 2 · Session 3', book:2, n:3, heading:'Words with letters and the kanna (second position)', time:'10\u201315 min',
    need:'All 2 copies of each letter card + kanna cards.', activity:'wordtable', table:'session3' },
  { key:'session', title:'Book 2 · Session 4', book:2, n:4, heading:'Using all letters WITH \u201caa\u201d matra', time:'10\u201315 min',
    need:'All 2 copies of each letter card with \u201caa\u201d matra.', activity:'wordgrid' },
  { key:'session', title:'Book 2 · Session 5', book:2, n:5, heading:'Kanna Bindi words!', time:'10\u201315 min',
    need:'All 2 copies of each letter card with kanna bindi.', activity:'wordtable', table:'session5' },
  { key:'session', title:'Book 2 · Session 6', book:2, n:6, heading:'2/3 letter words and both matras!', time:'10\u201315 min',
    need:'All letter cards + both matra cards.', activity:'wordgrid2' },
  { key:'book3title', title:'Book 3 — Making More Words' },
  { key:'letter', title:'Welcome to Book 3', heading:'Welcome to Book 3 — where reading really comes to life!',
    body:[
      'Cut out the word cards in the A4 sleeve labelled Book 3. Now you\u2019ll start reading real words, playing Snap and Memory, and using fun illustrations to help connect meaning with sound.',
      'Your word cards come in matching pairs — one pair includes English alliterations in small print to guide you, the second is alliteration-free for growing confidence.',
      'For deeper learning, the Punjabi-English dictionary published by Punjabi University (Patiala) is an excellent long-term resource.',
      'Get ready — Stage 2 brings a whole new set of fun, graded, illustrated books to take your Punjabi reading to the next level!'
    ]
  },
  { key:'session', title:'Book 3 · Session 1', book:3, n:1, heading:'Sounding out words with help!', time:'10\u201315 min',
    need:'First 5 word card pairs WITH English transliteration.', activity:'reading', words:'set1', help:true },
  { key:'session', title:'Book 3 · Session 3', book:3, n:3, heading:'Sounding out words, NO help!', time:'10\u201315 min',
    need:'First 5 word card pairs WITHOUT English transliteration.', activity:'reading', words:'set1', help:false },
  { key:'session', title:'Book 3 · Session 4', book:3, n:4, heading:'Sounding out more words!', time:'10\u201315 min',
    need:'Next 5 word card pairs WITH and WITHOUT transliteration.', activity:'reading', words:'set2', help:true },
  { key:'session', title:'Book 3 · Session 6', book:3, n:6, heading:'Reading the words with pictures!', time:'10\u201315 min',
    need:'Reading Book 4, with word and picture pages.', activity:'reading', words:'set2', help:false,
    badge:'You\u2019ve completed Stage 1!' },
  { key:'glossary', title:'Stage 1 Glossary' },
  { key:'stage2', title:'Ready for Stage 2?' },

function renderSessionPage(p, idx){
  const band = `<div class="page-band"><span>${p.title}</span><span class="sub">Rainbow Punjabi Accelerated Reading — Stage 1</span></div>`;

    activityHtml = `<div class="letter-row">${p.letters.map(l=>letterTile(l)).join('')}</div><div id="${mountId}"></div>`;
  } else if(p.activity === 'matra-intro'){
    activityHtml = `<div class="matra-box"><div class="m">${p.matra.sym}</div><div class="desc">Makes the "${p.matra.sound}" sound when attached to a letter.</div></div><div class="letter-row">${p.letters.map(l=>letterTile(l)).join('')}</div><div id="${mountId}"></div>`;

  const html = `${band}<div class="page-inner">
    <div class="session-header"><h2>${p.heading}</h2><span class="session-time">${p.time}</span></div>
    <p class="session-need">What you need: ${p.need}</p>
    ${activityHtml}
    ${badge}
  </div>`;

  setTimeout(()=>{
    if(p.activity === 'memory'){
      mountMemory(mountId, p.letters);
    } else if(p.activity === 'snap'){
      mountSnap(mountId, p.letters);
    } else if(p.activity === 'matra-intro'){
      mountSnap(mountId, p.letters);
    } else if(p.activity === 'wordbuild'){
      mountWordBuild(mountId);
    } else if(p.activity === 'snap-words'){
      mountSnap(mountId, [{gur:'ਹਰ',eng:'hr'},{gur:'ਹਸ',eng:'hs'},{gur:'ਗਰਮ',eng:'grm'}]);
    } else if(p.activity === 'wordtable'){
      mountWordTable(mountId, p.table);
    } else if(p.activity === 'wordgrid'){
      mountWordGrid(mountId);
    } else if(p.activity === 'wordgrid2'){
      mountWordGrid(mountId, true);
    } else if(p.activity === 'reading'){
      mountReading(mountId, p.words, p.help);

  return html;
}

function mountSnap(mountId, letters){
  const mount = document.getElementById(mountId);
  if(!mount) return;
  mount.innerHTML = `
    <button class="flip-btn" id="${mountId}_flip">Flip next card</button>
    <div class="snap-cards" id="${mountId}_cards"></div>
    <button class="snap-btn" id="${mountId}_call" disabled>SNAP!</button>
    <p class="feedback" id="${mountId}_fb"></p>`;
  let deck = [], lastCard = null;
  function build(){
    let d = [];
    letters.forEach(l=>{ d.push(l); d.push(l); });
    for(let i=d.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [d[i],d[j]]=[d[j],d[i]]; }
    return d;
  }
  function reset(){
    deck = build(); lastCard = null;
    document.getElementById(mountId+'_cards').innerHTML='';
    document.getElementById(mountId+'_call').disabled = true;
    document.getElementById(mountId+'_fb').textContent = '';
  }
  document.getElementById(mountId+'_flip').onclick = ()=>{
    if(deck.length===0){ document.getElementById(mountId+'_fb').textContent='Deck finished — reshuffling!'; reset(); return; }
    const card = deck.pop();
    const el = document.createElement('div');
    el.className='snap-card'; el.textContent = card.gur;
    document.getElementById(mountId+'_cards').appendChild(el);
    document.getElementById(mountId+'_fb').textContent = 'Say it: "' + card.eng + '"';
    const match = lastCard && lastCard.eng === card.eng;
    document.getElementById(mountId+'_call').disabled = !match;
    lastCard = card;
  };
  document.getElementById(mountId+'_call').onclick = ()=>{
    document.getElementById(mountId+'_fb').textContent = 'SNAP! Gold star earned.';
    addStars(1);
    document.getElementById(mountId+'_call').disabled = true;
  };
  reset();
}

function mountMemory(mountId, letters){
  const mount = document.getElementById(mountId);
  if(!mount) return;
  mount.innerHTML = `<div class="memory-grid" id="${mountId}_grid"></div><p class="feedback" id="${mountId}_fb"></p>`;
  let deck, flipped=[], matched=0, lock=false;
  function build(){
    let d = [];
    letters.forEach((l,i)=>{ d.push({...l,id:i+'a'}); d.push({...l,id:i+'b'}); });
    for(let i=d.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [d[i],d[j]]=[d[j],d[i]]; }
    return d;
  }
  function reset(){
    deck = build(); flipped=[]; matched=0; lock=false;
    const grid = document.getElementById(mountId+'_grid');
    grid.innerHTML='';
    document.getElementById(mountId+'_fb').textContent='';
    deck.forEach((card,idx)=>{
      const el = document.createElement('div');
      el.className='memory-card';
      el.onclick = ()=>flip(idx, el);
      grid.appendChild(el);
    });
  }
  function flip(idx, el){
    if(lock || el.classList.contains('flipped') || el.classList.contains('matched')) return;
    el.textContent = deck[idx].gur;
    el.classList.add('flipped');
    flipped.push({idx,el});
    if(flipped.length===2){
      lock = true;
      const [a,b] = flipped;
      if(deck[a.idx].eng === deck[b.idx].eng){
        a.el.classList.add('matched'); b.el.classList.add('matched');
        document.getElementById(mountId+'_fb').textContent = 'Matched "'+deck[a.idx].eng+'" — gold star!';
        addStars(1); matched++;
        flipped=[]; lock=false;
        if(matched===letters.length) document.getElementById(mountId+'_fb').textContent='All pairs found! Well done.';
      } else {
        setTimeout(()=>{
          a.el.classList.remove('flipped'); a.el.textContent='';
          b.el.classList.remove('flipped'); b.el.textContent='';
          flipped=[]; lock=false;
        },700);
      }
    }
  }
  reset();
}

function mountWordTable(mountId, tableKey){
  const mount = document.getElementById(mountId);
  if(!mount) return;
  const rows = WORD_SETS[tableKey] || [];
  const letters = ['h','r','g','m','s'];
  let html = `<p style="font-size:12px;color:rgba(27,36,48,0.6);">Tap any word to sound it out (green = real word).</p><table class="word-table"><tr><th></th>${letters.slice(0,(rows[0]||[]).length).map(l=>`<th>${l}</th>`).join('')}</tr>`;
  rows.forEach((row,ri)=>{
    html += `<tr><th>${letters[ri]||''}</th>${row.map((w,i)=>`<td class="${i%3===0?'real':'silly'}" onclick="this.style.color='var(--terracotta)'">${w}</td>`).join('')}</tr>`;
  });
  html += `</table>`;
  mount.innerHTML = html;
}

function mountWordGrid(mountId){
  const mount = document.getElementById(mountId);
  if(!mount) return;
  const letters = ['ਹਾ','ਰਾ','ਗਾ','ਮਾ','ਸਾ'];
  let html = `<p style="font-size:12px;color:rgba(27,36,48,0.6);">Green words are real — check the glossary page for meanings.</p><table class="word-table"><tr><th></th>${letters.map(l=>`<th>${l}</th>`).join('')}</tr>`;
  letters.forEach((rowL,ri)=>{
    html += `<tr><th>${rowL}</th>`;
    letters.forEach((colL,ci)=>{
      const real = (ri+ci)%2===0;
      html += `<td class="${real?'real':'silly'}">${rowL}${colL}</td>`;
    });
    html += `</tr>`;
  });
  html += `</table>`;
  mount.innerHTML = html;
}

function mountReading(mountId, setKey, showHelp){
  const mount = document.getElementById(mountId);
  if(!mount) return;
  const words = [
    {gur:'ਸਮਰ',rom:'smr',mean:'summer'},{gur:'ਹਾਰ',rom:'haar',mean:'necklace'},
    {gur:'ਹਾਗ',rom:'haag',mean:''},{gur:'ਸਾਗ',rom:'saag',mean:'saag dish'},
    {gur:'ਮਾਮਾ',rom:'mama',mean:'maternal uncle'}
  ];
  mount.innerHTML = `<p style="font-size:12px;color:rgba(27,36,48,0.6);">${showHelp?'Transliteration shown to help you sound it out.':'No help this time — sound it out yourself, then tap to check!'}</p>
    <div class="word-cards">${words.map(w=>`
      <div class="wc" onclick="this.classList.add('revealed'); this.querySelector('.rom').textContent='${w.mean||w.rom}';">
        ${w.gur}<span class="rom">${showHelp ? w.rom : '?'}</span>
      </div>`).join('')}</div>`;
}

function filterGlossary(q){
  const rows = document.querySelectorAll('#glossList .gloss-row');
  const query = q.toLowerCase();
  rows.forEach(r=>{
    const match = r.dataset.search.toLowerCase().includes(query);
    r.style.display = match ? 'flex' : 'none';
  });
}

const bookEl = document.getElementById('book');
let current = 0;
const total = PAGES.length;

function buildPages(){
  bookEl.innerHTML = '';
  PAGES.forEach((p, i)=>{
    const div = document.createElement('div');
    div.className = 'page';
    div.style.zIndex = total - i;
    div.innerHTML = `${renderPage(p,i)}<div class="page-num">${i+1} / ${total}</div>`;
    bookEl.appendChild(div);
  });
  updateStack();
}

function isMobileView(){
  return window.matchMedia('(max-width:640px)').matches;
}

function updateStack(){
  const pages = bookEl.querySelectorAll('.page');
  const mobile = isMobileView();
  pages.forEach((el,i)=>{
    if(mobile){
      if(i === current){
        el.style.transform = 'translateX(0)';
        el.style.opacity = '1';
        el.style.zIndex = total;
        el.style.pointerEvents = 'auto';
      } else {
        el.style.transform = i < current ? 'translateX(-30px)' : 'translateX(30px)';
        el.style.opacity = '0';
        el.style.zIndex = 0;
        el.style.pointerEvents = 'none';
      }
    } else {
      el.style.opacity = '';
      el.style.pointerEvents = '';
      if(i < current){
        el.style.transform = 'rotateY(-170deg)';
        el.style.zIndex = i;
      } else {
        el.style.transform = 'rotateY(0deg)';
        el.style.zIndex = total - i;
      }
    }
  });
  document.getElementById('pageIndicator').textContent = `Page ${current+1} / ${total}`;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===total-1;
  document.getElementById('jumpSelect').value = current;
}

window.addEventListener('resize', ()=>updateStack());

document.getElementById('prevBtn').onclick = ()=>{ if(current>0){ current--; updateStack(); } };
document.getElementById('nextBtn').onclick = ()=>{ if(current<total-1){ current++; updateStack(); } };
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') document.getElementById('nextBtn').click();
  if(e.key==='ArrowLeft') document.getElementById('prevBtn').click();
});

let touchStartX = null;
const stageEl = document.querySelector('.stage');
stageEl.addEventListener('touchstart', e=>{ touchStartX = e.changedTouches[0].clientX; }, {passive:true});
stageEl.addEventListener('touchend', e=>{
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){
    if(dx < 0) document.getElementById('nextBtn').click();
    else document.getElementById('prevBtn').click();
  }
  touchStartX = null;
}, {passive:true});

const jumpSelect = document.getElementById('jumpSelect');
PAGES.forEach((p,i)=>{
  const opt = document.createElement('option');
  opt.value = i; opt.textContent = (i+1)+'. '+p.title;
  jumpSelect.appendChild(opt);
});
jumpSelect.onchange = ()=>{ current = parseInt(jumpSelect.value); updateStack(); };

buildPages();
</script>
